# NES emulator self-check suite configuration.
#
# Consumed by tests/launcher.py. ROMs that are not listed here are
# still scanned automatically by walking the nes-test-roms submodule
# (see tests/rom_scanner.py) -- an empty config therefore means "run everything
# that looks like a test". Entries listed here override the scanned values
# and are the place to record human judgement.
#
# [settings]
#   frames   : frame count used when a test supplies none
#
# [[tests]]
#   id       : submodule-relative ROM path minus the .nes extension. This is
#              the ONLY key; it stays unique even for the 31 ROM basenames
#              that collide across suites (instr_test-v3 vs nes_instr_test,
#              blargg_apu_2005.07.30 vs pal_apu_tests, ...).
#              There is no `path` field: the location is derived from the id
#              at run time (tests/rom_scanner.py:path_of), so the two can never
#              disagree. Run reports print the full path.
#   frames   : optional frame budget, in NES frames. Listed tests pin the
#              count they were verified at; discovered ones use
#              test_roms.xml's `runframes`, falling back to
#              [settings].frames when the XML omits it.
#   detector : optional per-ROM judge override. "blargg" (default) reads the
#              nametable PASS/FAIL text; "joy3" is the read_joy3 tally
#              (N/1000, 0 = pass). Omit to use the suite default
#              (test_judge.DETECTOR_BY_DIR, else "blargg"). This per-ROM knob is
#              the ONLY detector setting -- there is deliberately no global
#              [settings] detector (nothing consumed it); don't reintroduce one.
#   expected : "pass" -- the only meaningful value. Every kept ROM is gated: a
#              non-PASS verdict fails the run. Do NOT use "skip"/"fail" to keep
#              a ROM out of the red line -- those silently drop it (never run)
#              WITHOUT listing it in the report's Ignored section. To not run a
#              ROM, use excluded = true below.
#   excluded : true -> the ROM is NOT run and NOT gated, and it is listed in the
#              report's Ignored section with its reason. This is the ONLY
#              "don't run this ROM" switch (document a hang / interactive /
#              known-fail, or keep a suite out of the sweep). Prefer it over any
#              expected value so nothing ever disappears silently.
#   reason   : required alongside excluded -- a short code + free text saying
#              why it isn't gated (e.g. "hang", "interactive", "known-fail").
#              Shown in the report's Ignored section; without it the exclusion
#              is undocumented.
#   note     : optional free text
#
# There is deliberately no "reference" field. test_roms.xml's `testresult`
# records what OTHER emulators do, and treating it as an expectation is
# exactly how ppu_vbl_nmi/10-even_odd_timing came to be mislabelled
# expected=fail (it passes here). Cross-emulator results belong in `note`.

[settings]
frames = 1200

# --- Verified passing (self-check baseline) -------------------------------
# These four have been run on this build and confirmed PASS at 1200 frames.
# expected=pass => a non-PASS verdict fails the run.
[[tests]]
id = "apu_test/apu_test"
frames = 1200
expected = "pass"

[[tests]]
id = "instr_misc/rom_singles/03-dummy_reads"
frames = 1200
expected = "pass"

[[tests]]
id = "instr_misc/rom_singles/04-dummy_reads_apu"
frames = 1200
expected = "pass"

[[tests]]
id = "ppu_vbl_nmi/rom_singles/10-even_odd_timing"
frames = 1200
expected = "pass"
note = "Locally verified PASS at 1200 frames (nametable reads 'Passed', $6000=0x00). Upstream status.txt reports FAIL for the reference emulators, but this build was never actually run against it until the submodule was fetched."


