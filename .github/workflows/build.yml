name: Build FanNes

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ---- Run the self-check on each OS (serial, in-place) --------------------
  # Each OS checks out, compiles the Cython extensions ONCE in-place, then runs
  # ALL must-pass ROMs serially in a single job. No shard fan-out and no cross-job
  # artifact sharing: the earlier shard design downloaded the compiled `nes/`
  # package between jobs, which proved unreliable under parallel download
  # (some `.pyd` files arrived missing/truncated -> spurious
  # "ModuleNotFoundError: No module named 'nes.console'"). Building in-place
  # in the same job that runs the tests keeps the compiled modules and the
  # source together and removes that failure mode. The runner exits non-zero on
  # any self-check failure, so this job is the gate (red = failure).
  # Each job inlines its own "checkout -> install build deps -> compile
  # extensions" steps (kept identical by hand) rather than a shared composite
  # action, so the workflow never depends on a separate action file being
  # present. Every step does exactly one thing.
  # Linux verification is temporarily disabled.
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Restore Cython build products
        id: cython-cache
        uses: actions/cache@v5
        with:
          path: |
            nes/**/*.c
            nes/**/*.pyd
            nes/**/*.so
            build
          key: ${{ runner.os }}-py312-cython-${{ hashFiles('nes/**/*.pyx', 'nes/**/*.pxd', 'nes/**/*.h', 'setup.py', 'requirements.txt', 'gui/**/*.py', 'nes-emulator.spec') }}

      - name: Compile Cython extensions
        shell: bash
        run: |
          if [ "${{ steps.cython-cache.outputs.cache-hit }}" = "true" ]; then
            find nes \( -name "*.c" -o -name "*.pyd" -o -name "*.so" \) -exec touch {} +
            if [ -d build ]; then find build -type f -exec touch {} +; fi
          else
            rm -rf build
            find . -name "*.c" -delete
            find . -name "*.h" -not -name "status_register.h" -delete
          fi
          python setup.py build_ext --inplace
          python -c "from nes.console import Console"

      - name: Self-check (serial, all must-pass ROMs)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python tests/launcher.py --platform windows

      - name: Publish report to run summary
        if: always()
        shell: bash
        run: |
          if [ -f tests/reports/latest.md ]; then
            cat tests/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-report-windows
          path: tests/reports/latest.json
          if-no-files-found: warn
          retention-days: 7

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Restore Cython build products
        id: cython-cache
        uses: actions/cache@v5
        with:
          path: |
            nes/**/*.c
            nes/**/*.pyd
            nes/**/*.so
            build
          key: ${{ runner.os }}-py312-cython-${{ hashFiles('nes/**/*.pyx', 'nes/**/*.pxd', 'nes/**/*.h', 'setup.py', 'requirements.txt', 'gui/**/*.py', 'nes-emulator.spec') }}

      - name: Compile Cython extensions
        shell: bash
        run: |
          if [ "${{ steps.cython-cache.outputs.cache-hit }}" = "true" ]; then
            find nes \( -name "*.c" -o -name "*.pyd" -o -name "*.so" \) -exec touch {} +
            if [ -d build ]; then find build -type f -exec touch {} +; fi
          else
            rm -rf build
            find . -name "*.c" -delete
            find . -name "*.h" -not -name "status_register.h" -delete
          fi
          python setup.py build_ext --inplace
          python -c "from nes.console import Console"

      - name: Self-check (serial, all must-pass ROMs)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python tests/launcher.py --platform macos

      - name: Publish report to run summary
        if: always()
        shell: bash
        run: |
          if [ -f tests/reports/latest.md ]; then
            cat tests/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-report-macos
          path: tests/reports/latest.json
          if-no-files-found: warn
          retention-days: 7

  # ---- Package the desktop app --------------------------------------------
  # Compiles the Cython extensions itself (in-place), then runs PyInstaller.
  # No shared compile artifact -- the per-OS compile is cheap relative to the
  # flakiness of passing build products between jobs.
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'false'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Restore Cython build products
        id: cython-cache
        uses: actions/cache@v5
        with:
          path: |
            nes/**/*.c
            nes/**/*.pyd
            nes/**/*.so
            build
          key: ${{ runner.os }}-py312-cython-${{ hashFiles('nes/**/*.pyx', 'nes/**/*.pxd', 'nes/**/*.h', 'setup.py', 'requirements.txt', 'gui/**/*.py', 'nes-emulator.spec') }}

      - name: Compile Cython extensions
        shell: bash
        run: |
          if [ "${{ steps.cython-cache.outputs.cache-hit }}" = "true" ]; then
            find nes \( -name "*.c" -o -name "*.pyd" -o -name "*.so" \) -exec touch {} +
            if [ -d build ]; then find build -type f -exec touch {} +; fi
          else
            rm -rf build
            find . -name "*.c" -delete
            find . -name "*.h" -not -name "status_register.h" -delete
          fi
          python setup.py build_ext --inplace
          python -c "from nes.console import Console"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller nes-emulator.spec --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: fannes-windows
          path: dist/FanNes
          retention-days: 5

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'false'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Restore Cython build products
        id: cython-cache
        uses: actions/cache@v5
        with:
          path: |
            nes/**/*.c
            nes/**/*.pyd
            nes/**/*.so
            build
          key: ${{ runner.os }}-${{ matrix.arch }}-py312-cython-${{ hashFiles('nes/**/*.pyx', 'nes/**/*.pxd', 'nes/**/*.h', 'setup.py', 'requirements.txt', 'gui/**/*.py', 'nes-emulator.spec') }}

      - name: Compile Cython extensions
        shell: bash
        run: |
          if [ "${{ steps.cython-cache.outputs.cache-hit }}" = "true" ]; then
            find nes \( -name "*.c" -o -name "*.pyd" -o -name "*.so" \) -exec touch {} +
            if [ -d build ]; then find build -type f -exec touch {} +; fi
          else
            rm -rf build
            find . -name "*.c" -delete
            find . -name "*.h" -not -name "status_register.h" -delete
          fi
          python setup.py build_ext --inplace
          python -c "from nes.console import Console"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Create macOS icon
        run: |
          mkdir -p FanNes.iconset
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size images/icon.png --out "FanNes.iconset/icon_${size}x${size}.png"
          done
          for size in 32 64 128 256 512 1024; do
            sips -z $size $size images/icon.png --out "FanNes.iconset/icon_$((size/2))x$((size/2))@2x.png"
          done
          iconutil -c icns FanNes.iconset -o images/FanNes.icns
          rm -rf FanNes.iconset

      - name: Build macOS App
        run: |
          # build/ is restored from a cache keyed only on Cython sources; stale
          # PyInstaller analysis would keep old GUI code. Force a fresh analysis.
          rm -rf build
          pyinstaller nes-emulator.spec --noconfirm

      - name: Verify macOS app bundle
        shell: bash
        run: |
          APP="dist/FanNes.app/Contents"
          plutil -lint "$APP/Info.plist"
          test -f "$APP/MacOS/FanNes"
          test -f "$APP/Resources/FanNes.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" = "FanNes"
          codesign --verify --deep --strict --verbose=2 dist/FanNes.app

          # Confirm the packaged executable is the requested architecture.
          echo "Packaged binary architecture:"
          lipo -archs "$APP/MacOS/FanNes" || file "$APP/MacOS/FanNes"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            file "$APP/MacOS/FanNes" | grep -q 'x86_64' || { echo "ERROR: expected x86_64 binary" >&2; exit 1; }
          else
            file "$APP/MacOS/FanNes" | grep -q 'arm64' || { echo "ERROR: expected arm64 binary" >&2; exit 1; }
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: fannes-macos-${{ matrix.arch }}
          # Uploading the parent keeps the FanNes.app wrapper in the archive.
          path: dist
          retention-days: 5

  release:
    needs: [test-windows, test-macos, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Resolve release version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Release tag $TAG_VERSION does not match pyproject.toml $PROJECT_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: fannes-windows
          path: release/Windows

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: fannes-macos-arm64
          path: release/macOS-arm64

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v7
        with:
          name: fannes-macos-x86_64
          path: release/macOS-x86_64

      - name: Create Windows ZIP archive
        run: |
          cd release/Windows
          zip -r "../FanNes-${RELEASE_VERSION}-Windows.zip" .

      - name: Fix macOS executable bits
        run: |
          chmod +x release/macOS-arm64/FanNes.app/Contents/MacOS/FanNes
          chmod +x release/macOS-x86_64/FanNes.app/Contents/MacOS/FanNes

      - name: Create macOS ZIP archives
        run: |
          cd release/macOS-arm64
          zip -r -y "../../FanNes-${RELEASE_VERSION}-macOS-arm64.zip" .
          cd ../macOS-x86_64
          zip -r -y "../../FanNes-${RELEASE_VERSION}-macOS-x86_64.zip" .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FanNes-${{ env.RELEASE_VERSION }}-Windows.zip
            release/FanNes-${{ env.RELEASE_VERSION }}-macOS-arm64.zip
            release/FanNes-${{ env.RELEASE_VERSION }}-macOS-x86_64.zip
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
