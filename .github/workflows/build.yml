name: Build FanNes

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download icon
        run: |
          New-Item -ItemType Directory -Force -Path images
          curl -L -o images/icon.png https://i.postimg.cc/g2sjHRZ0/icon.png

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Cython extensions
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          Get-ChildItem -Recurse -Filter "*.c" | Remove-Item -Force
          Get-ChildItem -Recurse -Filter "*.h" | Where-Object { $_.Name -ne "status_register.h" } | Remove-Item -Force
          python setup.py build_ext --inplace

      - name: Build Windows EXE
        run: |
          pyinstaller nes-emulator.spec --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fannes-windows
          path: dist/FanNes
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download icon
        run: |
          mkdir -p images
          curl -L -o images/icon.png https://i.postimg.cc/g2sjHRZ0/icon.png
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Cython extensions
        run: |
          rm -rf build
          find . -name "*.c" -delete
          find . -name "*.h" -not -name "status_register.h" -delete
          python setup.py build_ext --inplace

      - name: Build macOS App
        run: |
          pyinstaller nes-emulator.spec --noconfirm

      - name: Create macOS icon
        run: |
          mkdir -p FanNes.iconset
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size images/icon.png --out "FanNes.iconset/icon_${size}x${size}.png"
          done
          for size in 32 64 128 256 512 1024; do
            sips -z $size $size images/icon.png --out "FanNes.iconset/icon_$((size/2))x$((size/2))@2x.png"
          done
          iconutil -c icns FanNes.iconset -o images/FanNes.icns
          rm -rf FanNes.iconset

      - name: Create macOS app bundle
        run: |
          APP_PATH="dist/FanNes.app"
          mkdir -p "$APP_PATH/Contents/MacOS"
          mkdir -p "$APP_PATH/Contents/Resources"
          mv "dist/FanNes" "$APP_PATH/Contents/MacOS/FanNes"
          cp images/FanNes.icns "$APP_PATH/Contents/Resources/"
          cat > "$APP_PATH/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FanNes</string>
              <key>CFBundleIdentifier</key>
              <string>com.fannes.emulator</string>
              <key>CFBundleName</key>
              <string>FanNes</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleIconFile</key>
              <string>FanNes.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fannes-macos
          path: dist/FanNes.app
          retention-days: 5

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: fannes-windows
          path: release/Windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: fannes-macos
          path: release/macOS

      - name: Create ZIP archives
        run: |
          cd release/Windows
          powershell -Command "Compress-Archive -Path '*' -DestinationPath '../FanNes-Windows.zip'"
          cd ../macOS
          zip -r ../FanNes-macOS.zip .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FanNes-Windows.zip
            release/FanNes-macOS.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}