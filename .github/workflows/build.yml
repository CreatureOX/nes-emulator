name: Build FanNes

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ---- Run the gated regression on each OS (serial, in-place) ---------------
  # Each OS checks out, compiles the Cython extensions ONCE in-place, then runs
  # ALL gated ROMs serially in a single job. No shard fan-out and no cross-job
  # artifact sharing: the earlier shard design downloaded the compiled `nes/`
  # package between jobs, which proved unreliable under parallel download
  # (some `.pyd` files arrived missing/truncated -> spurious
  # "ModuleNotFoundError: No module named 'nes.console'"). Building in-place
  # in the same job that runs the tests keeps the compiled modules and the
  # source together and removes that failure mode. The runner exits non-zero on
  # any gated regression, so this job is the gate (red = regression).
  # Each job inlines its own "checkout -> install build deps -> compile
  # extensions" steps (kept identical by hand) rather than a shared composite
  # action, so the workflow never depends on a separate action file being
  # present. Every step does exactly one thing.
  # Linux verification is temporarily disabled.
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Compile Cython extensions
        shell: bash
        run: |
          rm -rf build
          find . -name "*.c" -delete
          find . -name "*.h" -not -name "status_register.h" -delete
          python setup.py build_ext --inplace

      - name: Run gated regression (serial, all gated ROMs)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python test/regression_runner.py --gated --platform windows

      - name: Publish report to run summary
        if: always()
        shell: bash
        run: |
          if [ -f test/reports/latest.md ]; then
            cat test/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-windows
          path: test/reports/latest.json
          if-no-files-found: warn
          retention-days: 7

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Compile Cython extensions
        shell: bash
        run: |
          rm -rf build
          find . -name "*.c" -delete
          find . -name "*.h" -not -name "status_register.h" -delete
          python setup.py build_ext --inplace

      - name: Run gated regression (serial, all gated ROMs)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python test/regression_runner.py --gated --platform macos

      - name: Publish report to run summary
        if: always()
        shell: bash
        run: |
          if [ -f test/reports/latest.md ]; then
            cat test/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-macos
          path: test/reports/latest.json
          if-no-files-found: warn
          retention-days: 7

  # ---- Package the desktop app --------------------------------------------
  # Compiles the Cython extensions itself (in-place), then runs PyInstaller.
  # No shared compile artifact -- the per-OS compile is cheap relative to the
  # flakiness of passing build products between jobs.
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'false'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Compile Cython extensions
        shell: bash
        run: |
          rm -rf build
          find . -name "*.c" -delete
          find . -name "*.h" -not -name "status_register.h" -delete
          python setup.py build_ext --inplace

      - name: Download icon
        run: |
          New-Item -ItemType Directory -Force -Path images
          curl -L -o images/icon.png https://i.postimg.cc/g2sjHRZ0/icon.png

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller nes-emulator.spec --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: fannes-windows
          path: dist/FanNes
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: 'false'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Compile Cython extensions
        shell: bash
        run: |
          rm -rf build
          find . -name "*.c" -delete
          find . -name "*.h" -not -name "status_register.h" -delete
          python setup.py build_ext --inplace

      - name: Download icon
        run: |
          mkdir -p images
          curl -L -o images/icon.png https://i.postimg.cc/g2sjHRZ0/icon.png

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build macOS App
        run: |
          pyinstaller nes-emulator.spec --noconfirm

      - name: Create macOS icon
        run: |
          mkdir -p FanNes.iconset
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size images/icon.png --out "FanNes.iconset/icon_${size}x${size}.png"
          done
          for size in 32 64 128 256 512 1024; do
            sips -z $size $size images/icon.png --out "FanNes.iconset/icon_$((size/2))x$((size/2))@2x.png"
          done
          iconutil -c icns FanNes.iconset -o images/FanNes.icns
          rm -rf FanNes.iconset

      - name: Create macOS app bundle
        run: |
          APP_PATH="dist/FanNes.app"
          mkdir -p "$APP_PATH/Contents/MacOS"
          mkdir -p "$APP_PATH/Contents/Resources"
          mv "dist/FanNes" "$APP_PATH/Contents/MacOS/FanNes"
          cp images/FanNes.icns "$APP_PATH/Contents/Resources/"
          cat > "$APP_PATH/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FanNes</string>
              <key>CFBundleIdentifier</key>
              <string>com.fannes.emulator</string>
              <key>CFBundleName</key>
              <string>FanNes</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleIconFile</key>
              <string>FanNes.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: fannes-macos
          path: dist/FanNes.app
          retention-days: 5

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: fannes-windows
          path: release/Windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: fannes-macos
          path: release/macOS

      - name: Create Windows ZIP archive
        run: |
          cd release/Windows
          powershell -Command "Compress-Archive -Path '*' -DestinationPath '../FanNes-Windows.zip'"

      - name: Create macOS ZIP archive
        run: |
          cd release/macOS
          zip -r ../FanNes-macOS.zip .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FanNes-Windows.zip
            release/FanNes-macOS.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
