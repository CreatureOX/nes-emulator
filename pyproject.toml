[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FanNes"
version = "0.0.2"
description = "FanNes - A NES/SNES Emulator"
authors = [
    {name = "CreatureOX", email = "creatureox0726@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
dependencies = [
    "pygame>=2.0.0",
    "numpy>=1.20.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]

[tool.setuptools]
packages = ["nes", "gui"]