[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FanNes"
version = "0.1.0"
description = "FanNes - a cycle-accurate NES emulator written in Python and Cython"
authors = [
    {name = "CreatureOX", email = "creatureox0726@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "pygame>=2.5.0",
    "FreeSimpleGUI>=4.6.0",
    "numpy>=1.21.0",
    "opencv-python>=4.8.0.0",
    "Pillow>=9.3.0",
    "Cython>=3.0.6",
    "keyboard",
    "toml>=0.10.2",
]

[tool.setuptools]
packages = ["nes", "gui"]